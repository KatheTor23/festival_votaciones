
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Festival Vallenato</title>
    <style>
        body {
            background: #090E17;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .contenedor {
            background: #131D2D;
            padding: 35px;
            border-radius: 14px;
            width: 360px;
            max-width: calc(100% - 40px);
        }

        h1 {
            color: #D6B46C;
            text-align: center;
        }

        label {
            display: block;
            margin: 15px 0 6px;
        }

        input {
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: 1px solid #354052;
            background: #202C3F;
            color: white;
            box-sizing: border-box;
        }

        button {
            background: #D6B46C;
            color: #090E17;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        a {
            color: #D6B46C;
        }

        .error {
            color: #FF9A9A;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Iniciar sesión</h1>

        <form method="POST">
            {% csrf_token %}

            {% for campo in formulario %}
                <label for="{{ campo.id_for_label }}">
                    {{ campo.label }}
                </label>

                {{ campo }}

                {% for error in campo.errors %}
                    <p class="error">{{ error }}</p>
                {% endfor %}
            {% endfor %}

            {% for error in formulario.non_field_errors %}
                <p class="error">{{ error }}</p>
            {% endfor %}

            <button type="submit">Ingresar</button>
        </form>

        <p>
            ¿No tienes cuenta?
            <a href="{% url 'registro' %}">
                Regístrate
            </a>
        </p>
        <p>
            ¿Olvidaste tu contraseña?
            <a href="{% url 'registro' %}">
                Recuperar Contraseña
            </a>
        </p>
    </div>

</body>
</html>
